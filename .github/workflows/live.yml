name: Live qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: Explicit consumer, local declaration or service gate
    runs-on: [self-hosted, Linux, X64, spoke-qualification]
    timeout-minutes: 40
    env:
      SPOKE_LIVE_CONFIG: ${{ vars.SPOKE_LIVE_CONFIG }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run explicit HTTP qualification
        env:
          SPOKE_LIVE_REPORT: ${{ runner.temp }}/spoke-live-report.json
        # The reviewed config selects an exact installed artifact and either a
        # clean local fixture, an externally supplied consumer HTTPS target,
        # or a service prerequisite check. No Platform deployment is performed.
        # Only the sanitized summary is uploaded; journals/state/logs stay private.
        run: |
          rm -f "$SPOKE_LIVE_REPORT"
          nix develop --no-update-lock-file --command just test-acc live
      - name: Preserve available evidence including blocked gates
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: http-qualification
          path: ${{ runner.temp }}/spoke-live-report.json
          if-no-files-found: error
