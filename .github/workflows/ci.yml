name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate all development shells
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Check formatting, workflows, unit tests, and mock acceptance
        run: nix develop --no-update-lock-file --command just check

      - name: Build provider
        run: nix develop --no-update-lock-file --command just build

  installed:
    name: Nix artifact and installed recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install and exercise exact Nix artifact
        run: nix develop --no-update-lock-file --command just test-acc installed
      - name: Check exported independent consumer
        run: |
          consumer_root="$(mktemp -d)"
          cp -R examples/installed-consumer "$consumer_root/consumer"
          cd "$consumer_root/consumer"
          nix develop --no-update-lock-file --command bash ./check.sh
